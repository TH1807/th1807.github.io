<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- Seguridad: la app solo puede mostrar el sistema de Google y sus propios archivos -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Talento Humano — Municipalidad de Olanchito</title>
    <meta name="description" content="Sistema de expedientes del personal de la Municipalidad de Olanchito.">
    <meta name="theme-color" content="#0b134b">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="48x48" href="iconos/favicon-48.png">
    <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Talento Humano">
    <style>
        :root {
            --navy: #0b134b; --azul: #38b6ff; --verde: #7aaf19; --amarillo: #f9cc21; --naranja: #ff751f; --magenta: #b51051;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #ffffff; }

        /* El sistema ocupa toda la pantalla, respetando la muesca y la barra de gestos */
        #sistema {
            position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #ffffff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Pantalla de bienvenida mientras carga el sistema */
        #bienvenida {
            position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 22px; padding: 24px; background: var(--navy); transition: opacity 0.35s ease;
        }
        #bienvenida.oculta { opacity: 0; pointer-events: none; }
        .tarjeta-logo { width: min(64vw, 280px); background: #ffffff; border-radius: 22px; padding: 18px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); }
        .tarjeta-logo img { display: block; width: 100%; height: auto; }
        .titulo { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 0.2px; text-align: center; }
        .subtitulo { margin: -14px 0 0; font-size: 15px; color: #c3cae4; text-align: center; }
        .carga { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.18); border-top-color: var(--azul); animation: girar 0.9s linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .franja { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; display: flex; }
        .franja span { flex: 1; }

        /* Mensajes: sin conexión o el sistema no responde */
        .mensaje { display: none; max-width: 340px; text-align: center; font-size: 15px; line-height: 1.45; color: #e4e8f6; }
        .mensaje b { display: block; font-size: 17px; margin-bottom: 4px; color: #ffffff; }
        .acciones { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .boton {
            appearance: none; border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-size: 15px; font-weight: 700;
            text-decoration: none; cursor: pointer; background: #ffffff; color: var(--navy);
        }
        .boton.secundario { background: rgba(255, 255, 255, 0.12); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.28); }
        .boton:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
        #bienvenida.con-mensaje .carga { display: none; }
        #bienvenida.con-mensaje .mensaje, #bienvenida.con-mensaje .acciones { display: flex; flex-direction: column; }
        #bienvenida.con-mensaje .acciones { flex-direction: row; }

        /* Aviso pequeño abajo si el sistema ya se ve pero no confirmó que cargó */
        #aviso {
            position: fixed; z-index: 3; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
            display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px;
            background: rgba(11, 19, 75, 0.96); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); font-size: 14px;
        }
        #aviso.visible { display: flex; }
        #aviso p { flex: 1 1 200px; margin: 0; color: #e4e8f6; }
        #aviso .boton { padding: 9px 14px; font-size: 14px; }
        @media (prefers-reduced-motion: reduce) { .carga { animation-duration: 2.5s; } #bienvenida { transition: none; } }

        /* Cámara de la app (Google ya no deja usarla dentro del sistema) */
        #camara { display: none; position: fixed; inset: 0; z-index: 50; background: #05081c; color: #fff; flex-direction: column; }
        #camara.abierta { display: flex; }
        .cam-barra { display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 14px 10px; }
        .cam-barra .t { flex: 1; min-width: 0; }
        .cam-barra b { display: block; font-size: 17px; font-weight: 800; }
        .cam-barra small { display: block; margin-top: 2px; font-size: 13px; color: #b7c0de; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cam-redondo { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cam-redondo[hidden] { display: none; }
        #camLinterna { color: #f9cc21; } #camLinterna[aria-pressed="true"] { background: #f9cc21; color: #0b134b; }
        #camara button:focus-visible { outline: 3px solid #f9cc21; outline-offset: 2px; }
        .cam-visor { position: relative; flex: 1; min-height: 0; background: radial-gradient(120% 80% at 50% 45%, #2a2a30 0%, #15151a 70%); overflow: hidden; }
        .cam-visor video, .cam-visor canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .cam-guia { display: none; position: absolute; left: 50%; top: 50%; width: min(64vw, 64vh); aspect-ratio: 1; transform: translate(-50%, -50%); border: 4px solid #38b6ff; border-radius: 22px; box-shadow: 0 0 0 100vmax rgba(5,8,28,0.45); }
        .modo-qr .cam-guia { display: block; }
        .cam-destello { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
        .cam-destello.activo { animation: camDestello 0.35s ease-out; }
        @keyframes camDestello { 0% { opacity: 0.85; } 100% { opacity: 0; } }
        .cam-estado { position: absolute; left: 12px; right: 12px; bottom: 16px; margin: 0 auto; width: fit-content; display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: rgba(11,19,75,0.92); border: 1px solid rgba(255,255,255,0.25); font-size: 14px; font-weight: 700; text-align: center; }
        .cam-estado::before { content: ''; width: 9px; height: 9px; flex: none; border-radius: 50%; background: #b7c0de; }
        .cam-estado.ok { border-color: rgba(56,182,255,0.5); } .cam-estado.ok::before { background: #7aaf19; }
        .cam-estado.aviso { border-color: rgba(249,204,33,0.6); } .cam-estado.aviso::before { background: #f9cc21; }
        .cam-controles { flex: none; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
        .modo-qr .cam-controles { display: none; }
        .cam-fila { display: flex; align-items: center; gap: 10px; min-height: 60px; }
        #camTira { display: flex; gap: 8px; }
        #camTira img { width: 44px; height: 58px; object-fit: cover; border-radius: 6px; border: 2px solid #38b6ff; }
        #camCuenta { flex: 1; font-size: 14px; color: #b7c0de; }
        .cam-fila3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; }
        #camAuto { justify-self: start; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer; }
        #camAuto[aria-pressed="false"] { background: transparent; color: #b7c0de; }
        #camObturador { justify-self: center; width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: #38b6ff; box-shadow: 0 0 0 4px rgba(56,182,255,0.35); cursor: pointer; }
        #camObturador:active { transform: scale(0.94); }
        #camListo { justify-self: end; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #fff; color: #0b134b; font: 800 15px system-ui, sans-serif; cursor: pointer; }
        #camListo:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <iframe id="sistema" title="Sistema de Talento Humano"
            allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation"></iframe>

    <div id="bienvenida" role="status" aria-live="polite">
        <div class="tarjeta-logo"><img src="iconos/logo.jpg" alt="Municipalidad de Olanchito"></div>
        <h1 class="titulo">Talento Humano</h1>
        <p class="subtitulo">Municipalidad de Olanchito</p>
        <div class="carga" aria-hidden="true"></div>
        <p class="mensaje" id="textoMensaje"></p>
        <div class="acciones">
            <button type="button" class="boton" id="btnReintentar">Reintentar</button>
            <a class="boton secundario" id="btnNavegador" target="_blank" rel="noopener">Abrir en el navegador</a>
        </div>
        <div class="franja" aria-hidden="true">
            <span style="background:#7aaf19"></span><span style="background:#f9cc21"></span><span style="background:#ff751f"></span>
            <span style="background:#38b6ff"></span><span style="background:#b51051"></span>
        </div>
    </div>


    <!-- Cámara: la usa el sistema para escanear documentos y carnets -->
    <div id="camara" role="dialog" aria-modal="true" aria-label="Cámara">
        <header class="cam-barra">
            <button type="button" class="cam-redondo" id="camCerrar" aria-label="Cerrar la cámara">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
            <div class="t"><b id="camTitulo">Escanear documento</b><small id="camSubtitulo"></small></div>
            <button type="button" class="cam-redondo" id="camLinterna" aria-label="Encender la linterna" aria-pressed="false" hidden>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
            </button>
        </header>
        <div class="cam-visor">
            <video id="camVideo" autoplay playsinline muted></video>
            <canvas id="camMarco" aria-hidden="true"></canvas>
            <div class="cam-guia" aria-hidden="true"></div>
            <div class="cam-destello" id="camDestello"></div>
            <div class="cam-estado" id="camEstado" role="status" aria-live="polite"></div>
        </div>
        <div class="cam-controles">
            <div class="cam-fila"><div id="camTira"></div><span id="camCuenta">Aún no hay páginas</span></div>
            <div class="cam-fila3">
                <button type="button" id="camAuto" aria-pressed="true">Automático</button>
                <button type="button" id="camObturador" aria-label="Tomar la página"></button>
                <button type="button" id="camListo" disabled>Listo ✓</button>
            </div>
        </div>
    </div>
    <script src="camara.js"></script>

    <div id="aviso" role="alert">
        <p>¿El sistema no carga? Si este teléfono tiene varias cuentas de Google, ábralo en el navegador.</p>
        <a class="boton" id="btnNavegadorAviso" target="_blank" rel="noopener">Abrir en el navegador</a>
        <button type="button" class="boton secundario" id="btnCerrarAviso">Cerrar</button>
    </div>

    <script>
        // ======================================================================
        // ENLACE DEL SISTEMA: el /exec de la implementación de Apps Script.
        // Es el mismo de los QR. Si algún día cambia la implementación, cambie solo esta línea.
        // ======================================================================
        var URL_SISTEMA = 'https://script.google.com/macros/s/AKfycbxFW3SWOTBdu7Ly8HGsZPX-vRZzZpRUPNRmEoZpxrZ8vLWNDlaa-cnLy8dvdC0-Rj1RlA/exec';

        var ESPERA_MAXIMA = 15000;   // ms antes de ofrecer "Abrir en el navegador"
        var marco = document.getElementById('sistema');
        var bienvenida = document.getElementById('bienvenida');
        var aviso = document.getElementById('aviso');
        var texto = document.getElementById('textoMensaje');
        var listo = false, temporizador = null, respaldo = null;

        document.getElementById('btnNavegador').href = URL_SISTEMA;
        document.getElementById('btnNavegadorAviso').href = URL_SISTEMA;

        function ocultarBienvenida() { bienvenida.classList.add('oculta'); }
        function mostrarMensaje(titulo, detalle) {
            texto.innerHTML = '<b>' + titulo + '</b>' + detalle;
            bienvenida.classList.remove('oculta');
            bienvenida.classList.add('con-mensaje');
        }

        function cargar() {
            listo = false;
            clearTimeout(temporizador); clearTimeout(respaldo);
            aviso.classList.remove('visible');
            bienvenida.classList.remove('con-mensaje', 'oculta');
            if (!navigator.onLine) {
                mostrarMensaje('Sin conexión a internet', 'Conéctese a una red Wi-Fi o a los datos móviles. El sistema se abre solo al volver la conexión.');
                return;
            }
            // Un número distinto en cada apertura: el teléfono nunca reutiliza una versión vieja del sistema.
            marco.src = URL_SISTEMA + '?t=' + Date.now();
            temporizador = setTimeout(function () {
                if (listo) return;
                if (bienvenida.classList.contains('oculta')) aviso.classList.add('visible');
                else mostrarMensaje('El sistema tarda en responder', 'Revise la conexión e intente otra vez. Si este teléfono tiene varias cuentas de Google, ábralo en el navegador.');
            }, ESPERA_MAXIMA);
        }

        // El sistema (SistemaRRHH.html) avisa cuando terminó de cargar
        window.addEventListener('message', function (e) {
            var host = '';
            try { host = new URL(e.origin).hostname; } catch (err) {}
            var desdeGoogle = /(^|\.)googleusercontent\.com$|^script\.google\.com$/.test(host);
            if (!desdeGoogle || !e.data || e.data.tipo !== 'rrhh-listo') return;
            listo = true;
            clearTimeout(temporizador); clearTimeout(respaldo);
            aviso.classList.remove('visible');
            ocultarBienvenida();
        });

        // Respaldo: si el marco cargó pero el sistema no avisó (por ejemplo, una página de error de Google),
        // se muestra lo que haya para que se pueda leer el mensaje.
        marco.addEventListener('load', function () {
            if (!marco.getAttribute('src') || listo) return;
            clearTimeout(respaldo);
            respaldo = setTimeout(function () { if (!listo) ocultarBienvenida(); }, 6000);
        });

        document.getElementById('btnReintentar').addEventListener('click', cargar);
        document.getElementById('btnCerrarAviso').addEventListener('click', function () { aviso.classList.remove('visible'); });
        window.addEventListener('online', function () { if (!listo) cargar(); });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function () {}); });
        }
        cargar();
    </script>
</body>
</html>
